[project]
name = "hardened-wp"
version = "2.0.0"
description = "Production-ready WordPress Docker image - Bedrock + FrankenPHP + Acorn, rootless and lightweight"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy==1.15.0",
    "ruff==0.9.10",
    "yamllint>=1.38.0",
    "zizmor>=1.31.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true

